<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  
  <!-- Center Vibrant Glow Circle -->
  <circle cx="256" cy="256" r="148" fill="url(#violetGrad)" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Waveform Bars Behind / Integrated -->
  <rect x="144" y="226" width="12" height="60" rx="6" fill="#F8FAFC" opacity="0.85"/>
  <rect x="168" y="196" width="12" height="120" rx="6" fill="#F8FAFC" opacity="0.85"/>
  <rect x="192" y="166" width="12" height="180" rx="6" fill="#F8FAFC" opacity="0.95"/>
  
  <!-- Playhead & Lyric Video Note / Triangle -->
  <path d="M236 176 L356 256 L236 336 Z" fill="url(#amberGrad)" filter="url(#glow)"/>
  
  <!-- Modern Sparkle Star in top right -->
  <path d="M374 126 C374 144 388 158 406 158 C388 158 374 172 374 190 C374 172 360 158 342 158 C360 158 374 144 374 126 Z" fill="#FBBF24"/>
</svg>
